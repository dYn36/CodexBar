name: Langdock real packaged-app profile proof
"on":
  push:
    branches: [codex/browser-profile-display-names]
    paths: [.github/workflows/langdock-profile-ui-proof.yml]
permissions: {}
concurrency:
  group: langdock-pr4911-ui-proof
  cancel-in-progress: false
jobs:
  actual-app:
    runs-on: xcode-27
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Verify hosted runner and Xcode
        env:
          PROOF_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$PROOF_RUNNER_ENVIRONMENT" = github-hosted
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
      - name: Prepare ordinary isolated VM app state
        env:
          PROOF_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 - <<'PY'
          def remote_prepare():
              from pathlib import Path
              import hashlib
              import json
              import os
              import subprocess
              import atexit
              import shutil
              import signal
              import re
              import xml.sax.saxutils

              run = os.environ["GITHUB_RUN_ID"]
              attempt = os.environ["GITHUB_RUN_ATTEMPT"]
              assert os.environ["PROOF_RUNNER_ENVIRONMENT"] == "github-hosted"
              assert run.isdigit() and attempt.isdigit()
              root = Path(os.environ["RUNNER_TEMP"]) / ("pr4911-ui-" + run + "-" + attempt)
              assert not root.exists(), "Do not reuse an existing proof directory"
              suffix = "r" + run + "a" + attempt
              app_id = "org.codexbar.proof4911.fixture." + suffix
              test_id = "org.codexbar.proof4911.uitests." + suffix
              domains = [app_id, test_id, test_id + ".xctrunner"]
              def domain_exists(domain):
                  result = subprocess.run(["/usr/bin/defaults", "read", domain], capture_output=True, text=True)
                  if result.returncode == 0:
                      return True
                  missing = re.search(r"Domain\s+" + re.escape(domain) + r"\s+does not exist\b",
                                      result.stdout + result.stderr, re.IGNORECASE)
                  confirmed_not_found = result.stderr.strip() == "Error: Domain '" + domain + "' not found."
                  if result.returncode == 1 and (missing or confirmed_not_found):
                      return False
                  raise RuntimeError("Preference namespace state is unknown: " + domain
                                     + "; exit=" + str(result.returncode)
                                     + "; stderr=" + repr(result.stderr.strip()[:500]))
              before = {d: domain_exists(d) for d in domains}
              assert not any(before.values()), "Preserve preexisting preference namespaces"
              paths_before = {}
              for domain in domains:
                  for area, leaf in [
                      ("Preferences", domain + ".plist"), ("Saved Application State", domain + ".savedState"),
                      ("Caches", domain), ("HTTPStorages", domain), ("WebKit", domain),
                      ("Application Support", domain), ("Containers", domain),
                  ]:
                      path = Path.home() / "Library" / area / leaf
                      paths_before[str(path)] = os.path.lexists(path)
                  assert not list((Path.home() / "Library/Preferences/ByHost").glob(domain + ".*.plist"))
              assert not any(paths_before.values()), "Preserve existing proof-named files"
              created = [False]
              completed = [False]
              def rollback_incomplete_preparation():
                  if created[0] and not completed[0] and root.exists():
                      shutil.rmtree(root)
              atexit.register(rollback_incomplete_preparation)
              def interrupted(signum, frame):
                  raise SystemExit(128 + signum)
              signal.signal(signal.SIGTERM, interrupted)
              root.mkdir(mode=0o700)
              created[0] = True
              (root / ".owned-by-pr4911").write_text(run + ":" + attempt)
              plan = {"root": str(root), "domains_existed_before": before, "paths_existed_before": paths_before,
                      "app_id": app_id, "test_id": test_id,
                      "rules": "No TCC, authorizationdb, security, sudo, credentials, browser or user data operations."}
              (root / "plan.json").write_text(json.dumps(plan, indent=2))
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("PROOF_ROOT=" + str(root) + "\n")
              observations = root / "observations"
              observations.mkdir()
              (root / "Fixture.swift").write_text(r'''
          import Foundation
          import SwiftUI

          @main struct ProofFixture: App {
              init() {
                  if let output = ProcessInfo.processInfo.environment["PROOF_OUTPUT"] {
                      let environment = ProcessInfo.processInfo.environment
                      let keys = ["XCTestConfigurationFilePath", "XCTestBundlePath", "XCTestSessionIdentifier",
                                  "TESTING_LIBRARY_VERSION", "SWIFT_TESTING", "SWIFT_TESTING_ENABLED"]
                      let markers = Dictionary(uniqueKeysWithValues: keys.map { ($0, environment[$0] != nil) })
                      if let data = try? JSONSerialization.data(withJSONObject: markers, options: [.sortedKeys]) {
                          try? data.write(to: URL(fileURLWithPath: output).appendingPathComponent("app-test-markers.json"))
                      }
                  }
              }
              var body: some Scene {
                  WindowGroup {
                      Text("PR4911 preflight main")
                          .font(.system(size: 28)).padding(50).frame(width: 640, height: 260)
                          .preferredColorScheme(.light)
                  }
                  Settings {
                      Text("PR4911 preflight settings")
                          .font(.system(size: 28)).padding(50).frame(width: 640, height: 260)
                          .preferredColorScheme(.light)
                  }
              }
          }
          ''')
              (root / "UITests.swift").write_text(r'''
          import Foundation
          import XCTest
          import XCUIAutomation
          import CryptoKit

          final class PreflightTests: XCTestCase {
              @MainActor
              func testPreferencesShortcutAndScreenshot() throws {
                  self.executionTimeAllowance = 90
                  let output = try XCTUnwrap(ProcessInfo.processInfo.environment["PROOF_OUTPUT"])
                  let app = XCUIApplication()
                  app.launchEnvironment["PROOF_OUTPUT"] = output
                  app.launch()
                  defer { app.terminate() }
                  let main = app.staticTexts["PR4911 preflight main"].waitForExistence(timeout: 20)
                  XCTAssertTrue(main, "The own fixture main window must exist")
                  guard main else { return }
                  app.typeKey(",", modifierFlags: .command)
                  let settings = app.staticTexts["PR4911 preflight settings"].waitForExistence(timeout: 20)
                  XCTAssertTrue(settings, "Cmd+, must open the own settings window")
                  guard settings else { return }
                  let window = app.windows.containing(.staticText, identifier: "PR4911 preflight settings").firstMatch
                  XCTAssertTrue(window.waitForExistence(timeout: 10))
                  let screenshot = window.screenshot()
                  let png = screenshot.pngRepresentation
                  XCTAssertGreaterThan(png.count, 4096)
                  let imageAttachment = XCTAttachment(data: png, uniformTypeIdentifier: "public.png")
                  imageAttachment.name = "PR4911 preflight settings"
                  imageAttachment.lifetime = .keepAlways
                  self.add(imageAttachment)
                  let captured = png.count > 4096
                  let result: [String: Any] = [
                      "mainWindow": main, "settingsShortcut": settings, "screenshotCaptured": captured,
                      "pngBytes": png.count, "pngSHA256": SHA256.hash(data: png).map { String(format: "%02x", $0) }.joined(), "passed": main && settings && captured,
                  ]
                  let data = try JSONSerialization.data(withJSONObject: result, options: [.sortedKeys])
                  let metadataAttachment = XCTAttachment(data: data, uniformTypeIdentifier: "public.json")
                  metadataAttachment.name = "PR4911 preflight result"
                  metadataAttachment.lifetime = .keepAlways
                  self.add(metadataAttachment)
                  print("PR4911_UI_PREFLIGHT_OBSERVATIONS \(String(decoding: try JSONSerialization.data(withJSONObject: result, options: [.sortedKeys]), as: UTF8.self))")
              }
          }
          ''')
              objects = {}
              def oid(label):
                  return hashlib.sha1(label.encode()).hexdigest()[:24].upper()
              def obj(label, isa, **fields):
                  key = oid(label)
                  assert key not in objects
                  objects[key] = {"isa": isa, **fields}
                  return key
              app_file = obj("app-file", "PBXFileReference", lastKnownFileType="sourcecode.swift",
                             path="Fixture.swift", sourceTree="<group>")
              tests_file = obj("tests-file", "PBXFileReference", lastKnownFileType="sourcecode.swift",
                               path="UITests.swift", sourceTree="<group>")
              app_product = obj("app-product", "PBXFileReference", explicitFileType="wrapper.application",
                                includeInIndex=0, path="ProofFixture.app", sourceTree="BUILT_PRODUCTS_DIR")
              tests_product = obj("tests-product", "PBXFileReference", explicitFileType="wrapper.cfbundle",
                                  includeInIndex=0, path="ProofUITests.xctest", sourceTree="BUILT_PRODUCTS_DIR")
              products = obj("products", "PBXGroup", children=[app_product, tests_product],
                             name="Products", sourceTree="<group>")
              group = obj("main-group", "PBXGroup", children=[app_file, tests_file, products], sourceTree="<group>")
              common = {"MACOSX_DEPLOYMENT_TARGET": "15.0", "SDKROOT": "macosx", "SWIFT_VERSION": "6.0",
                        "CLANG_ENABLE_MODULES": "YES", "CODE_SIGN_IDENTITY": "-", "CODE_SIGN_STYLE": "Manual",
                        "CODE_SIGNING_ALLOWED": "YES", "ENABLE_HARDENED_RUNTIME": "NO",
                        "ONLY_ACTIVE_ARCH": "YES", "ENABLE_TESTABILITY": "YES"}
              global_config = obj("global-debug", "XCBuildConfiguration", name="Debug", buildSettings=common)
              global_list = obj("global-list", "XCConfigurationList", buildConfigurations=[global_config],
                                defaultConfigurationIsVisible=0, defaultConfigurationName="Debug")
              def target_config(label, bundle_id, **extra):
                  config = obj(label + "-debug", "XCBuildConfiguration", name="Debug", buildSettings={
                      "PRODUCT_NAME": "$(TARGET_NAME)", "PRODUCT_BUNDLE_IDENTIFIER": bundle_id,
                      "GENERATE_INFOPLIST_FILE": "YES", **extra,
                  })
                  return obj(label + "-config-list", "XCConfigurationList", buildConfigurations=[config],
                             defaultConfigurationIsVisible=0, defaultConfigurationName="Debug")
              app_config = target_config("app", app_id)
              tests_config = target_config("tests", test_id, TEST_TARGET_NAME="ProofFixture",
                                          LD_RUNPATH_SEARCH_PATHS=["$(inherited)", "@executable_path/../Frameworks", "@loader_path/Frameworks"])
              def phase(label, isa, files):
                  return obj(label, isa, buildActionMask=2147483647, files=files, runOnlyForDeploymentPostprocessing=0)
              app_build = obj("app-build", "PBXBuildFile", fileRef=app_file)
              tests_build = obj("tests-build", "PBXBuildFile", fileRef=tests_file)
              app_sources = phase("app-sources", "PBXSourcesBuildPhase", [app_build])
              tests_sources = phase("tests-sources", "PBXSourcesBuildPhase", [tests_build])
              app_frameworks = phase("app-frameworks", "PBXFrameworksBuildPhase", [])
              tests_frameworks = phase("tests-frameworks", "PBXFrameworksBuildPhase", [])
              app_target = obj("app-target", "PBXNativeTarget", name="ProofFixture", productName="ProofFixture",
                               productType="com.apple.product-type.application", productReference=app_product,
                               buildConfigurationList=app_config, buildPhases=[app_sources, app_frameworks],
                               buildRules=[], dependencies=[])
              proxy = obj("target-proxy", "PBXContainerItemProxy", containerPortal=oid("project"), proxyType=1,
                          remoteGlobalIDString=app_target, remoteInfo="ProofFixture")
              dependency = obj("test-dependency", "PBXTargetDependency", target=app_target, targetProxy=proxy)
              tests_target = obj("tests-target", "PBXNativeTarget", name="ProofUITests", productName="ProofUITests",
                                 productType="com.apple.product-type.bundle.ui-testing", productReference=tests_product,
                                 buildConfigurationList=tests_config, buildPhases=[tests_sources, tests_frameworks],
                                 buildRules=[], dependencies=[dependency])
              project = obj("project", "PBXProject", attributes={
                  "LastUpgradeCheck": "2700", "TargetAttributes": {
                      app_target: {"CreatedOnToolsVersion": "27.0"},
                      tests_target: {"CreatedOnToolsVersion": "27.0", "TestTargetID": app_target},
                  }}, buildConfigurationList=global_list, compatibilityVersion="Xcode 14.0",
                  developmentRegion="en", hasScannedForEncodings=0, knownRegions=["en", "Base"],
                  mainGroup=group, productRefGroup=products, projectDirPath="", projectRoot="",
                  targets=[app_target, tests_target])
              def encode(value):
                  if isinstance(value, dict):
                      return "{\n" + "".join(encode(k) + " = " + encode(v) + ";\n" for k, v in value.items()) + "}"
                  if isinstance(value, list):
                      return "(" + "".join(encode(v) + "," for v in value) + ")"
                  if isinstance(value, int):
                      return str(value)
                  return '"' + str(value).replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n") + '"'
              project_dir = root / "Preflight.xcodeproj"
              scheme_dir = project_dir / "xcshareddata/xcschemes"
              scheme_dir.mkdir(parents=True)
              data = {"archiveVersion": 1, "classes": {}, "objectVersion": 56, "objects": objects, "rootObject": project}
              (project_dir / "project.pbxproj").write_text("// !$*UTF8*$!\n" + encode(data) + "\n")
              escape = xml.sax.saxutils.escape
              def reference(identifier, name, product):
                  return f'<BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="{identifier}" BuildableName="{product}" BlueprintName="{name}" ReferencedContainer="container:Preflight.xcodeproj"/>'
              scheme = f'''<?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="2700" version="1.7">
            <BuildAction parallelizeBuildables="NO" buildImplicitDependencies="YES"><BuildActionEntries>
              <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="NO" buildForArchiving="NO" buildForAnalyzing="NO">{reference(app_target, "ProofFixture", "ProofFixture.app")}</BuildActionEntry>
              <BuildActionEntry buildForTesting="YES" buildForRunning="NO" buildForProfiling="NO" buildForArchiving="NO" buildForAnalyzing="NO">{reference(tests_target, "ProofUITests", "ProofUITests.xctest")}</BuildActionEntry>
            </BuildActionEntries></BuildAction>
            <TestAction buildConfiguration="Debug" shouldUseLaunchSchemeArgsEnv="NO">
              <Testables><TestableReference skipped="NO">{reference(tests_target, "ProofUITests", "ProofUITests.xctest")}</TestableReference></Testables>
              <MacroExpansion>{reference(app_target, "ProofFixture", "ProofFixture.app")}</MacroExpansion>
              <EnvironmentVariables><EnvironmentVariable key="PROOF_OUTPUT" value="{escape(str(observations))}" isEnabled="YES"/></EnvironmentVariables>
            </TestAction>
          </Scheme>
          '''
              (scheme_dir / "Preflight.xcscheme").write_text(scheme)
              completed[0] = True
              print("Prepared unique disposable Xcode UI fixture; no third-party tool installation.")
          remote_prepare()
          def real_prepare():
              from pathlib import Path
              import json
              import os
              import re
              import subprocess

              assert os.environ['PROOF_RUNNER_ENVIRONMENT'] == 'github-hosted'
              root = Path(os.environ['RUNNER_TEMP']) / ('pr4911-ui-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              assert not root.is_symlink() and (root / '.owned-by-pr4911').read_text() == os.environ['GITHUB_RUN_ID'] + ':' + os.environ['GITHUB_RUN_ATTEMPT']
              with open(os.environ['GITHUB_ENV'], 'a') as output: output.write('REAL_APP_EXTERNAL_CLEANUP_BLOCKED=1\n')
              plan = json.loads((root / 'plan.json').read_text())
              domains = ['com.steipete.codexbar.debug', 'Y5PE65HELJ.com.steipete.codexbar.debug',
                         'group.com.steipete.codexbar.debug']
              before = {}
              for domain in domains:
                  result = subprocess.run(['/usr/bin/defaults', 'read', domain], capture_output=True, text=True)
                  missing = result.returncode == 1 and (
                      result.stderr.strip() == "Error: Domain '" + domain + "' not found."
                      or re.search(r'Domain\s+' + re.escape(domain) + r'\s+does not exist\b', result.stdout + result.stderr))
                  assert missing, 'Preserve existing or unknown application defaults'
                  before[domain] = False
              home = Path.home()
              paths = []
              for domain in domains:
                  for area, leaf in [('Preferences', domain + '.plist'), ('Saved Application State', domain + '.savedState'),
                                     ('Caches', domain), ('HTTPStorages', domain), ('WebKit', domain),
                                     ('Application Support', domain), ('Containers', domain)]:
                      paths.append(home / 'Library' / area / leaf)
                  assert not list((home / 'Library/Preferences/ByHost').glob(domain + '.*.plist'))
              paths += [home / 'Library/Application Support/CodexBar',
                        home / 'Library/Group Containers/Y5PE65HELJ.com.steipete.codexbar.debug',
                        home / 'Library/Group Containers/group.com.steipete.codexbar.debug',
                        home / 'Library/Application Support/Microsoft Edge',
                        home / 'Library/Application Support/Google/Chrome', home / '.config/codexbar']
              assert not any(os.path.lexists(p) for p in paths), 'Preserve existing application/browser files'
              parents_before = {}
              for path in paths:
                  for parent in path.parents:
                      if parent == home: break
                      assert parent.is_relative_to(home)
                      parents_before[str(parent)] = os.path.lexists(parent)
              plan['real_app'] = {'domains_existed_before': before, 'paths_existed_before': {str(p): False for p in paths},
                                  'parents_existed_before': parents_before,
                                  'rules': 'Fresh hosted VM; ordinary settings/config, synthetic metadata only; no credentials, imports, grants or real browser launches.'}
              (root / 'plan.json').write_text(json.dumps(plan, indent=2))
              for browser, relative in [('chrome', 'Google/Chrome'), ('edge', 'Microsoft Edge')]:
                  browser_root = home / 'Library/Application Support' / relative
                  profile = browser_root / 'Default'
                  (profile / 'Network').mkdir(parents=True)
                  (profile / 'Cookies').touch()
                  (profile / 'Network/Cookies').touch()
                  (browser_root / 'Local State').write_text(json.dumps({'profile': {'info_cache': {'Default': {'name': 'Proof ' + browser.title()}}}}))
              defaults = {'settingsSelectedPane': 'provider:langdock', 'providersEnabledOnly': False,
                          'providerDetectionCompleted': True, 'refreshFrequency': 'manual',
                          'tokenCostUsageEnabled': False, 'launchAtLogin': False,
                          'codexbar.legacySecretsMigrationCompleted': True, 'appGroupMigrationVersion': 1,
                          'debugDisableKeychainAccess': True}
              for key, value in defaults.items():
                  flag = '-bool' if isinstance(value, bool) else '-int' if isinstance(value, int) else '-string'
                  text = 'true' if value is True else 'false' if value is False else str(value)
                  subprocess.run(['/usr/bin/defaults', 'write', domains[0], key, flag, text], check=True)
              (root / 'UITests.swift').write_text(r'''
          import AppKit
          import CryptoKit
          import Foundation
          import XCTest
          import XCUIAutomation

          final class PreflightTests: XCTestCase {
              @MainActor
              func testRealPackagedProfile() throws {
                  self.executionTimeAllowance = 150
                  let env = ProcessInfo.processInfo.environment
                  let bundlePath = try XCTUnwrap(env["PROOF_APP_BUNDLE"])
                  let configPath = try XCTUnwrap(env["PROOF_CONFIG"])
                  let variant = try XCTUnwrap(env["PROOF_VARIANT"])
                  let browser = try XCTUnwrap(env["PROOF_BROWSER"])
                  let phase = try XCTUnwrap(env["PROOF_PHASE"])
                  let desired = try XCTUnwrap(env["PROOF_EXPECTED_NAME"])
                  let id = "com.steipete.codexbar.debug"
                  let expectedURL = URL(fileURLWithPath: bundlePath).resolvingSymlinksInPath()
                  guard NSRunningApplication.runningApplications(withBundleIdentifier: id).isEmpty,
                        NSWorkspace.shared.urlForApplication(withBundleIdentifier: id)?.resolvingSymlinksInPath() == expectedURL else {
                      XCTFail("The exact own bundle must be registered, with no preexisting instance")
                      return
                  }
                  let app = XCUIApplication(bundleIdentifier: id)
                  app.launchEnvironment["CODEXBAR_CONFIG"] = configPath
                  app.launchEnvironment["CODEXBAR_DISABLE_KEYCHAIN_ACCESS"] = "1"
                  app.launchArguments = ["-AppleLanguages", "(de)", "-AppleLocale", "de_DE"]
                  defer {
                      let running = NSRunningApplication.runningApplications(withBundleIdentifier: id)
                      if running.allSatisfy({ $0.bundleURL?.resolvingSymlinksInPath() == expectedURL }) { app.terminate() }
                  }

                  func exactAppPID() throws -> pid_t {
                      let running = NSRunningApplication.runningApplications(withBundleIdentifier: id)
                      XCTAssertEqual(running.count, 1)
                      let process = try XCTUnwrap(running.first)
                      XCTAssertEqual(process.bundleURL?.resolvingSymlinksInPath().path,
                                     URL(fileURLWithPath: bundlePath).resolvingSymlinksInPath().path)
                      return process.processIdentifier
                  }
                  func openSettings() -> XCUIElement {
                      app.launch()
                      app.activate()
                      app.typeKey(",", modifierFlags: .command)
                      let window = app.windows["com.steipete.codexbar.settings"]
                      XCTAssertTrue(window.waitForExistence(timeout: 25), "Real settings window must open")
                      return window
                  }
                  func visible(_ value: String, in window: XCUIElement) -> Bool {
                      let matches = window.descendants(matching: .any).matching(
                          NSPredicate(format: "label == %@ OR value == %@", value, value))
                      for index in 0..<min(matches.count, 30) {
                          if matches.element(boundBy: index).isHittable { return true }
                      }
                      return false
                  }
                  let window = openSettings()
                  guard window.exists else { return }
                  let firstPID = try exactAppPID()
                  let german = window.staticTexts["Browserprofil"].waitForExistence(timeout: 15)
                  XCTAssertTrue(german, "Use the actual German provider pane")
                  let desiredVisible = visible(desired, in: window)
                  let fallbackVisible = visible("Standard", in: window)
                  let expected = variant == "head" ? desiredVisible : !desiredVisible && fallbackVisible
                  if !german || !expected { print("PR4911_REAL_AX " + String(window.debugDescription.prefix(12000))) }
                  XCTAssertTrue(expected, "Observe the expected baseline failure or head correction")
                  let png = window.screenshot().pngRepresentation
                  XCTAssertTrue(png.count > 4096 && png.count <= 262144)
                  let picture = XCTAttachment(data: png, uniformTypeIdentifier: "public.png")
                  picture.name = "PR4911 real " + variant + " " + browser + " " + phase
                  picture.lifetime = .keepAlways
                  self.add(picture)
                  let controls = window.popUpButtons.allElementsBoundByIndex.prefix(20).map { control in
                      ["label": control.label, "value": String(describing: control.value ?? "")]
                  }
                  app.terminate()
                  XCTAssertTrue(app.wait(for: .notRunning, timeout: 15))
                  let secondWindow = openSettings()
                  guard secondWindow.exists else { return }
                  let secondPID = try exactAppPID()
                  XCTAssertNotEqual(firstPID, secondPID, "Restart the same packaged app as a new process")
                  XCTAssertTrue(secondWindow.staticTexts["Browserprofil"].waitForExistence(timeout: 15))
                  let afterRestartDesired = visible(desired, in: secondWindow)
                  let afterRestartFallback = visible("Standard", in: secondWindow)
                  let restartExpected = variant == "head" ? afterRestartDesired : !afterRestartDesired && afterRestartFallback
                  XCTAssertTrue(restartExpected)
                  let result: [String: Any] = [
                      "variant": variant, "browser": browser, "phase": phase,
                      "desiredName": desired, "desiredVisible": desiredVisible, "fallbackVisible": fallbackVisible,
                      "germanPane": german, "sameExactBundle": true, "newProcessAfterRestart": firstPID != secondPID,
                      "desiredVisibleAfterRestart": afterRestartDesired, "fallbackVisibleAfterRestart": afterRestartFallback,
                      "popupControls": controls, "pngBytes": png.count,
                      "pngSHA256": SHA256.hash(data: png).map { String(format: "%02x", $0) }.joined(),
                      "passed": expected && restartExpected && german && firstPID != secondPID && png.count > 4096,
                  ]
                  let data = try JSONSerialization.data(withJSONObject: result, options: [.sortedKeys])
                  let metadata = XCTAttachment(data: data, uniformTypeIdentifier: "public.json")
                  metadata.name = "PR4911 real result"
                  metadata.lifetime = .keepAlways
                  self.add(metadata)
                  print("PR4911_REAL_UI " + String(decoding: data, as: UTF8.self))
              }
          }
          ''')
              print('Prepared ordinary app preferences and synthetic Chrome/Edge stores; no accounts or browser processes.')

          real_prepare()
          PY

      - name: Package exact source revisions and exercise real app settings
        timeout-minutes: 57
        env:
          PROOF_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 - <<'PY'
          def real_execute():
              from pathlib import Path
              import hashlib
              import json
              import os
              import plistlib
              import re
              import subprocess
              import sys
              import time

              assert os.environ['PROOF_RUNNER_ENVIRONMENT'] == 'github-hosted'
              root = Path(os.environ['PROOF_ROOT'])
              env = dict(os.environ, CODEXBAR_SIGNING='adhoc', CODEXBAR_ALLOW_LLDB='0', ARCHES='arm64',
                         GIT_TERMINAL_PROMPT='0')
              results = []
              report = {'scope': 'Real packaged app on a fresh hosted VM with synthetic metadata only; no cookie imports or live account tests.',
                        'variants': [], 'stages': results, 'completed': False}
              (root / 'real-report.json').write_text(json.dumps(report, indent=2))
              import atexit
              import signal
              active = [None]
              def stop_active():
                  process = active[0]
                  if process is None or process.poll() is not None:
                      return
                  # This live Popen owns the session created immediately below.
                  os.killpg(process.pid, signal.SIGTERM)
                  try: process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      if process.poll() is None: os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=10)
              atexit.register(stop_active)
              def interrupted(signum, frame):
                  stop_active()
                  raise SystemExit(128 + signum)
              signal.signal(signal.SIGTERM, interrupted)
              signal.signal(signal.SIGINT, interrupted)
              def run_logged(command, log, cwd=None, timeout=1800):
                  with open(log, 'w') as output:
                      process = subprocess.Popen(command, cwd=cwd, env=env, stdout=output, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      active[0] = process
                      try:
                          return process.wait(timeout=timeout)
                      finally:
                          stop_active()
                          active[0] = None
              def checked(command, cwd=None):
                  return subprocess.check_output(command, cwd=cwd, env=env, text=True).strip()
