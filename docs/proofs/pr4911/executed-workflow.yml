                  (root / 'real-report.json').write_text(json.dumps(report, indent=2))
              def patch_run(value, updates):
                  if isinstance(value, dict):
                      if 'TestBundlePath' in value:
                          value.setdefault('EnvironmentVariables', {}).update(updates)
                      for child in value.values(): patch_run(child, updates)
                  elif isinstance(value, list):
                      for child in value: patch_run(child, updates)
              build_exit = run_logged(['/usr/bin/xcodebuild', 'build-for-testing', '-project', str(root / 'Preflight.xcodeproj'),
                                      '-scheme', 'Preflight', '-destination', 'platform=macOS', '-derivedDataPath', str(root / 'DerivedData'),
