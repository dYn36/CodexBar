          let deadline = Date().addingTimeInterval(5)
          while applications.contains(where: { !$0.isTerminated }) && Date() < deadline {
              RunLoop.current.run(until: Date().addingTimeInterval(0.1))
          }
          for app in applications where !app.isTerminated { _ = app.forceTerminate() }
          let forceDeadline = Date().addingTimeInterval(3)
          while applications.contains(where: { !$0.isTerminated }) && Date() < forceDeadline {
              RunLoop.current.run(until: Date().addingTimeInterval(0.1))
          }
          let remaining = ownedApplications().count
          print("PR4911_OWN_APPLICATIONS_REMAINING \(remaining)")
          exit(remaining == 0 ? 0 : 1)
          '''
              try:
                  result = subprocess.run(
                      ["/usr/bin/xcrun", "swift", "-module-cache-path", str(root / "cleanup-module-cache"),
                       "-", str(root / "DerivedData/Build/Products"), *domains],
                      input=teardown, text=True, capture_output=True, timeout=45)
                  print(result.stdout)
                  if result.returncode != 0:
                      summary["cleanup_errors"].append("Instance-bound app termination failed")
              except Exception as error:
                  summary["cleanup_errors"].append("App termination: " + type(error).__name__)
              def own_pids():
                  result = []
                  for row in subprocess.check_output(["ps", "-axo", "pid=,command="], text=True).splitlines():
                      fields = row.strip().split(None, 1)
                      if len(fields) == 2 and int(fields[0]) != os.getpid() and str(root) + "/" in fields[1]:
                          result.append(int(fields[0]))
                  return result
              expected_paths = {
                  str(Path.home() / "Library" / area / leaf)
                  for domain in domains for area, leaf in [
                      ("Preferences", domain + ".plist"), ("Saved Application State", domain + ".savedState"),
                      ("Caches", domain), ("HTTPStorages", domain), ("WebKit", domain),
                      ("Application Support", domain), ("Containers", domain),
                  ]}
              try:
                  deadline = time.monotonic() + 5
                  while own_pids() and time.monotonic() < deadline:
                      time.sleep(.2)
                  assert not own_pids(), "Own processes remain; do not delete their diagnostic root"
                  if plan is None:
                      raise RuntimeError("No valid before-state; preserve unverified external cleanup")
                  assert set(plan["domains_existed_before"]) == set(domains)
                  assert not any(plan["domains_existed_before"].values())
                  assert set(plan["paths_existed_before"]) == expected_paths
                  assert not any(plan["paths_existed_before"].values())
                  lsregister = "/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
                  for bundle in (root / "DerivedData/Build/Products/Debug").glob("*.app"):
                      try: subprocess.run([lsregister, "-u", str(bundle)], check=True, capture_output=True)
                      except Exception: summary["cleanup_errors"].append("Own bundle unregister failed")
                  for domain in domains:
                      try:
                          subprocess.run(["/usr/bin/defaults", "delete", domain], capture_output=True)
                          for path in (Path.home() / "Library/Preferences/ByHost").glob(domain + ".*.plist"):
                              path.unlink()
                      except Exception: summary["cleanup_errors"].append("Own preference cleanup failed: " + domain)
                  for raw_path in expected_paths:
                      try:
                          path = Path(raw_path)
                          if os.path.lexists(path):
                              assert not path.is_symlink()
                              if path.is_dir(): shutil.rmtree(path)
                              else: path.unlink()
                          assert not os.path.lexists(path)
                      except Exception: summary["cleanup_errors"].append("Own test-path cleanup failed")
                  shutil.rmtree(root)
              except Exception as error:
                  summary["cleanup_errors"].append(type(error).__name__ + ": " + str(error))
              summary["cleanup_root_absent"] = not root.exists()
              summary["own_processes_absent"] = not own_pids()
              summary["originally_absent_test_paths_restored"] = all(
                  not os.path.lexists(path) for path in expected_paths)
              domain_states = {}
              byhost_states = {}
              for domain in domains:
                  result = subprocess.run(["/usr/bin/defaults", "read", domain], capture_output=True, text=True)
                  known_missing = result.returncode == 1 and (result.stderr.strip() == "Error: Domain '" + domain + "' not found." or bool(re.search(
                      r"Domain\s+" + re.escape(domain) + r"\s+does not exist\b",
                      result.stdout + result.stderr, re.IGNORECASE)))
                  domain_states[domain] = "absent" if known_missing else "present" if result.returncode == 0 else "unknown"
                  byhost_states[domain] = not list((Path.home() / "Library/Preferences/ByHost").glob(domain + ".*.plist"))
              summary["logical_preference_domains"] = domain_states
              summary["byhost_paths_absent"] = byhost_states
              summary["capture_preflight_passed"] = summary["xcodebuild_exit"] == 0 and bool(
                  summary["observations"] and summary["observations"].get("passed")) and bool(
                  exported_images) and all(v["capsule_released"] for v in exported_images) and summary["attachment_metadata_confirmed"]
              summary["readability_verification"] = "pending external visual review of the unchanged native PNG"
              summary["cleanup_verified"] = summary["cleanup_root_absent"] and summary["own_processes_absent"] and summary["originally_absent_test_paths_restored"] and all(v == "absent" for v in domain_states.values()) and all(byhost_states.values()) and not summary["cleanup_errors"]
              print("PR4911_PREFLIGHT_SUMMARY " + json.dumps(summary, sort_keys=True))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write("## Isolated UI preflight\n\n~~~json\n" + json.dumps(summary, indent=2) + "\n~~~\n")
              if not summary["cleanup_verified"]:
                  raise RuntimeError("Cleanup verification failed; see explicit summary")
              if summary["xcodebuild_exit"] == 0 and not summary["capture_preflight_passed"]:
                  raise RuntimeError("UI observations are not fully proven; no successful preflight is claimed")
          remote_cleanup()
          PY

      - name: Enforce the actual-app gate
        if: always()
        run: test "${REAL_APP_PROOF_FAILED:-0}" != 1
