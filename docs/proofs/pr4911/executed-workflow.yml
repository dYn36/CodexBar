              assert len(runs) == 1
              original_run = plistlib.loads(runs[0].read_bytes())
              lsregister = '/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister'
              for variant, revision in [('head', 'ac8e6a93d083f46b52984052317f425309d20894'),
                                        ('base', '897bff31731bb4b21b105f6e8bf4c32a8a8bf095')]:
                  source = root / ('source-' + variant)
                  source.mkdir()
                  for command in [['git', 'init', '-q'], ['git', 'remote', 'add', 'origin', 'https://github.com/dYn36/CodexBar.git'],
                                  ['git', '-c', 'credential.helper=', 'fetch', '--depth=1', 'origin', revision],
                                  ['git', 'checkout', '--detach', '-q', 'FETCH_HEAD']]:
                      assert run_logged(command, root / ('git-' + variant + '.log'), cwd=source, timeout=180) == 0
                  assert checked(['git', 'rev-parse', 'HEAD'], cwd=source) == revision
                  assert not checked(['git', 'status', '--porcelain', '--untracked-files=no'], cwd=source)
                  print('PR4911_PACKAGE_START ' + variant + ' ' + revision, flush=True)
                  package_exit = run_logged(['bash', './Scripts/package_app.sh', 'debug'], root / ('package-' + variant + '.log'), cwd=source)
                  if package_exit != 0:
                      print('\n'.join((root / ('package-' + variant + '.log')).read_text().splitlines()[-70:]))
                      raise RuntimeError('Normal app packaging failed: ' + variant)
                  bundle = source / 'CodexBar.app'
                  info = plistlib.loads((bundle / 'Contents/Info.plist').read_bytes())
                  assert info['CFBundleIdentifier'] == 'com.steipete.codexbar.debug'
                  assert str(info.get('CodexGitCommit', '')).startswith(revision[:7])
                  subprocess.run(['codesign', '--verify', '--deep', '--strict', str(bundle)], check=True)
                  sign = subprocess.run(['codesign', '-dv', '--verbose=4', str(bundle)], capture_output=True, text=True, check=True)
                  entitlement = subprocess.run(['codesign', '-d', '--entitlements', ':-', str(bundle)], capture_output=True, check=True)
                  entitlements = plistlib.loads(entitlement.stdout)
                  assert not entitlements.get('com.apple.security.get-task-allow', False)
                  assert not checked(['git', 'status', '--porcelain', '--untracked-files=no'], cwd=source)
                  binary = bundle / 'Contents/MacOS' / info['CFBundleExecutable']
                  report['variants'].append({'variant': variant, 'sourceCommit': revision,
                                             'binarySHA256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                                             'codeDirectoryHash': re.search(r'^CDHash=(.+)$', sign.stderr, re.MULTILINE).group(1),
                                             'getTaskAllow': False, 'packageSourceClean': True})
                  save()
                  subprocess.run([lsregister, '-f', str(bundle)], check=True)
                  providers_source = (source / 'Sources/CodexBarCore/Providers/Providers.swift').read_text()
                  enum_body = providers_source.split('public enum UsageProvider:', 1)[1].split('\n}', 1)[0]
                  providers = re.findall(r'^    case ([a-zA-Z0-9_]+)\s*$', enum_body, re.MULTILINE)
                  assert len(providers) > 50 and 'langdock' in providers
                  for browser, relative in [('edge', 'Microsoft Edge'), ('chrome', 'Google/Chrome')]:
                      browser_root = Path.home() / 'Library/Application Support' / relative
                      profile = str(browser_root / 'Default')
                      config = root / (variant + '-' + browser + '-config.json')
                      entries = [{'id': provider, 'enabled': False} for provider in providers]
                      langdock = next(p for p in entries if p['id'] == 'langdock')
                      langdock.update({'source': 'web', 'cookieSource': 'auto', 'browserID': browser, 'browserProfileID': profile})
                      config.write_text(json.dumps({'version': 1, 'providers': entries, 'shareUsageWithCLI': False}))
                      phases = [('initial', 'Proof ' + browser.title())]
                      if variant == 'head': phases.append(('renamed-default', 'Default'))
                      for phase, expected_name in phases:
                          (browser_root / 'Local State').write_text(json.dumps({'profile': {'info_cache': {'Default': {'name': expected_name}}}}))
                          before_config = json.loads(config.read_text())
                          selected = next(p for p in before_config['providers'] if p['id'] == 'langdock')
                          assert selected['browserID'] == browser and selected['browserProfileID'] == profile
                          assert all(not p.get('enabled', False) for p in before_config['providers'])
                          parameters = {'PROOF_APP_BUNDLE': str(bundle), 'PROOF_CONFIG': str(config), 'PROOF_VARIANT': variant,
                                        'PROOF_BROWSER': browser, 'PROOF_PHASE': phase, 'PROOF_EXPECTED_NAME': expected_name}
                          settings = plistlib.loads(plistlib.dumps(original_run))
                          patch_run(settings, parameters)
                          stage_id = variant + '-' + browser + '-' + phase
                          test_run = runs[0].parent / (stage_id + '.xctestrun')
                          test_run.write_bytes(plistlib.dumps(settings))
                          result_path = root / (stage_id + '.xcresult')
                          log = root / (stage_id + '.log')
                          code = run_logged(['/usr/bin/xcodebuild', 'test-without-building', '-xctestrun', str(test_run),
                                             '-destination', 'platform=macOS', '-resultBundlePath', str(result_path),
                                             '-parallel-testing-enabled', 'NO'], log, timeout=360)
                          output = log.read_text()
                          print('\n'.join(output.splitlines()[-45:]), flush=True)
                          after_config = json.loads(config.read_text())
                          selected_after = next(p for p in after_config['providers'] if p['id'] == 'langdock')
                          identity_stable = selected_after.get('browserID') == browser and selected_after.get('browserProfileID') == profile
                          providers_disabled = all(not p.get('enabled', False) for p in after_config['providers'])
                          record = {'stage': stage_id, 'variant': variant, 'browser': browser, 'phase': phase,
                                    'xcodebuild_exit': code, 'selectedRawIDUnchanged': identity_stable, 'allProvidersDisabled': providers_disabled}
                          results.append(record)
                          save()
                          assert code == 0 and identity_stable and providers_disabled, 'Actual app UI phase failed: ' + stage_id
                  subprocess.run([lsregister, '-u', str(bundle)], check=True)
              report['completed'] = True
              save()
              print('PR4911_REAL_EXECUTION_COMPLETE ' + json.dumps(report, sort_keys=True), flush=True)

          real_execute()
          PY

